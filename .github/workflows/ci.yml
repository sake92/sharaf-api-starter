name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check generated contracts
        run: |
          sbt --batch generateContracts
          git diff --exit-code -- modules/api/src/main/scala modules/client/src/main/scala
      - name: Check formatting and run tests
        run: sbt --batch "scalafmtCheckAll; test"
      - name: Build container
        run: docker build --tag sharaf-api-starter:ci .
