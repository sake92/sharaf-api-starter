name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check generated contracts
        run: |
          sbt --batch generateContracts
          git add --intent-to-add -- modules/api/src/main/scala modules/client/src/main/scala
          git diff --exit-code -- modules/api/src/main/scala modules/client/src/main/scala
      - name: Check formatting and run tests
        run: sbt --batch "scalafmtCheckAll; test"
      - name: Build container
        run: docker build --tag sharaf-api-starter:ci .

  openapi-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare openapi/petclinic.yaml with base branch
        id: diff
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- openapi/petclinic.yaml; then
            echo "touched=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "touched=true" >> "$GITHUB_OUTPUT"
          git show "origin/${{ github.base_ref }}:openapi/petclinic.yaml" > "$RUNNER_TEMP/base.yaml" || {
            echo "breaking=unknown" >> "$GITHUB_OUTPUT"; exit 0; }
          set +e
          docker run --rm -v "$RUNNER_TEMP:/base" -v "$PWD/openapi:/new" \
            openapitools/openapi-diff:2.1.0-beta.12 \
            --fail-on-incompatible /base/base.yaml /new/petclinic.yaml
          code=$?
          if [ $code -eq 0 ]; then echo "breaking=false" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 1 ]; then echo "breaking=true" >> "$GITHUB_OUTPUT"
          else echo "breaking=unknown" >> "$GITHUB_OUTPUT"; fi
      - name: Comment on PR
        if: steps.diff.outputs.touched == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BREAKING: ${{ steps.diff.outputs.breaking }}
        with:
          script: |
            const marker = '<!-- openapi-diff -->';
            const msgs = {
              'true': '⚠️ **Breaking** changes detected in `openapi/petclinic.yaml` compared to the base branch.',
              'false': '✅ No breaking changes detected in `openapi/petclinic.yaml` compared to the base branch.',
              'unknown': 'ℹ️ Could not determine OpenAPI compatibility with the base branch.'
            };
            const body = `${marker}\n${msgs[process.env.BREAKING] || msgs.unknown}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
