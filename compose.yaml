services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-petclinic}
      POSTGRES_USER: ${DB_USER:-petclinic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-petclinic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-petclinic}
      DB_USER: ${DB_USER:-petclinic}
      DB_PASSWORD: ${DB_PASSWORD:-petclinic}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
